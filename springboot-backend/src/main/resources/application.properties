# ===== Server =====
server.port=8001

# ===== MongoDB =====
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/journey360}
spring.data.mongodb.database=journey360

# ===== API Keys =====
gemini.api.key=${GEMINI_API_KEY:}
openrouter.api.key=${OPENROUTER_API_KEY:}
openroute.api.key=${OPENROUTE_API_KEY:}
openweather.api.key=${OPENWEATHER_API_KEY:}
serpapi.api.key=${SERPAPI_API_KEY:}
news.api.key=${NEWS_API_KEY:}
rapidapi.key=${RAPIDAPI_KEY:}
aviationstack.key=${AVIATIONSTACK_KEY:}
foursquare.api.key=${FOURSQUARE_API_KEY:}

# ===== SMTP (Email Notifications) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.protocol=smtps
spring.mail.username=${SMTP_EMAIL:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

# ===== Firebase =====
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:firebase_key.json}
firebase.credentials.json=${FIREBASE_CREDENTIALS:}

# ===== Feature flags =====
app.mock-ai=${MOCK_AI:false}
app.offline-mode=${OFFLINE_MODE:false}

# ===== Logging =====
logging.level.com.journey360=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n

# ===== Error Detail (for debugging) =====
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always
